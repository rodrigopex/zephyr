# General config
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# General
# # Networking config
# CONFIG_NETWORKING=y
# CONFIG_NET_IPV4=y
# CONFIG_NET_IPV6=y
# CONFIG_NET_TCP=y
# CONFIG_NET_SHELL=y
#
# # Sockets
# CONFIG_NET_SOCKETS=y
# CONFIG_ZVFS_POLL_MAX=4
# CONFIG_POSIX_API=y
#
# # Network driver config
# CONFIG_TEST_RANDOM_GENERATOR=y
#
# # Network buffers
CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_PKT_TX_COUNT=16
CONFIG_NET_BUF_RX_COUNT=128
CONFIG_NET_BUF_TX_COUNT=128
# CONFIG_NET_CONTEXT_NET_PKT_POOL=y
#
# # Network address config
# CONFIG_NET_CONFIG_SETTINGS=y
# CONFIG_NET_CONFIG_NEED_IPV4=y
# CONFIG_NET_CONFIG_NEED_IPV6=y
# CONFIG_NET_CONFIG_MY_IPV4_ADDR="192.0.2.1"
# CONFIG_NET_CONFIG_MY_IPV4_GW="192.0.2.2"
# # Address of HTTP IPv4 server
# CONFIG_NET_CONFIG_PEER_IPV4_ADDR="192.0.2.2"
# CONFIG_NET_CONFIG_MY_IPV6_ADDR="2001:db8::1"
# # Address of HTTP IPv6 server
# CONFIG_NET_CONFIG_PEER_IPV6_ADDR="2001:db8::2"

CONFIG_HEAP_MEM_POOL_SIZE=98816
CONFIG_HEAP_MEM_POOL_IGNORE_MIN=y
CONFIG_SYSTEM_HEAP_ALLOC_SRAM1_RECLAIM_AREA=y
# # Sockets
CONFIG_NET_SOCKETS=y
CONFIG_ZVFS_POLL_MAX=4
CONFIG_POSIX_API=y
# HTTP
CONFIG_HTTP_CLIENT=y

# Network debug config
CONFIG_LOG=y
CONFIG_NET_LOG=y
CONFIG_NET_SOCKETS_LOG_LEVEL_DBG=n
CONFIG_NET_HTTP_LOG_LEVEL_DBG=n
CONFIG_NET_IPV6_LOG_LEVEL_DBG=n
CONFIG_NET_IPV6_ND_LOG_LEVEL_DBG=n

# Wi-Fi Configuration
CONFIG_WIFI=y

# Logging (Zephyr)
CONFIG_NET_LOG=y
CONFIG_NET_CONNECTION_MANAGER_LOG_LEVEL_DBG=y

# Networking
CONFIG_NETWORKING=y
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_MGMT_EVENT_QUEUE_SIZE=10
# CONFIG_NET_TCP_WORKQ_STACK_SIZE=8192
CONFIG_NET_CONFIG_AUTO_INIT=n
# CONFIG_NET_DHCPV4_SERVER=y
# This is the maximum number of connections that can be active at any given time.
CONFIG_NET_MAX_CONN=12
# This is the maximum number of sockets available to the application
CONFIG_NET_DHCPV4=y
CONFIG_NET_IPV4=y
CONFIG_NET_IF_MAX_IPV4_COUNT=2
CONFIG_NET_IPV6=n
CONFIG_NET_SOCKETS=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_L2_WIFI_MGMT=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_INFO=y
CONFIG_NET_MGMT_EVENT_STACK_SIZE=4096
CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_PKT_TX_COUNT=16
CONFIG_NET_TCP=y
CONFIG_NET_MAX_CONTEXTS=12
CONFIG_NET_UDP=y

CONFIG_WIFI_ESP32=y
CONFIG_ESP32_WIFI_STA_AUTO_DHCPV4=y
CONFIG_ESP32_WIFI_STA_RECONNECT=y
CONFIG_ESP32_WIFI_AP_STA_MODE=y
# CONFIG_WIFI_NM=y
# CONFIG_WIFI_NM_MAX_MANAGED_INTERFACES=2

# Networking (Sockets)
CONFIG_NET_SOCKETS_SOCKOPT_TLS=y
# The maximum number of certs to be used when resolving root of trust on a socket
CONFIG_NET_SOCKETS_TLS_MAX_CREDENTIALS=3
# We need to increase the number of sockets to allow for the HTTP server to be used.
CONFIG_NET_SOCKETS_POLL_MAX=6
# The socket stack size needs to be increased for AP to work
CONFIG_NET_SOCKETS_SERVICE_STACK_SIZE=4096

# Networking (DNS)
CONFIG_DNS_RESOLVER=y
CONFIG_DNS_RESOLVER_AI_MAX_ENTRIES=5

# Networking (Connection Manager)
CONFIG_NET_CONNECTION_MANAGER=y
CONFIG_NET_CONNECTION_MANAGER_CONNECTIVITY_WIFI_MGMT=y

# Network (Configs)
# CONFIG_NET_TCP_WORKQ_STACK_SIZE=4096
CONFIG_NET_BUF_DATA_SIZE=256
CONFIG_NET_TX_STACK_SIZE=4096
CONFIG_NET_RX_STACK_SIZE=4096

# The below configs allow each device on the network to be identified on a network by the address:
# <hostname>.local. This is useful for identifying devices on a network without needing to know the
# IP address.
CONFIG_NET_HOSTNAME_ENABLE=y
CONFIG_NET_HOSTNAME="hotbot"
CONFIG_NET_HOSTNAME_UNIQUE=n
# This allows the device to respond to <hostname>.local
CONFIG_MDNS_RESPONDER=y

# # Networking (WiFi AP)
# CONFIG_WIFI_INTERFACE_AP_MODE=y
# CONFIG_WIFI_INTERFACE_AP_SSID="Hotbot"
# # The below config allows the SSID to be unique by appending the MAC address to the SSID.
# CONFIG_WIFI_INTERFACE_AP_SSID_UNIQUE=y
# CONFIG_WIFI_INTERFACE_AP_PASSWORD=""

# TLS configuration
CONFIG_TLS_CREDENTIALS=y
# Must match the number of certs being added with tls_credential_add
CONFIG_TLS_MAX_CREDENTIALS_NUMBER=3
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_SHELL=y
CONFIG_MBEDTLS_MEMORY_DEBUG=y
CONFIG_MBEDTLS_BUILTIN=y
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_MBEDTLS_HEAP_SIZE=60000
CONFIG_MBEDTLS_SSL_MAX_CONTENT_LEN=7168
CONFIG_MBEDTLS_SERVER_NAME_INDICATION=y
CONFIG_MBEDTLS_SHA1=y
CONFIG_MBEDTLS_X509_CRL_PARSE_C=y
CONFIG_MBEDTLS_PSA_CRYPTO_C=y
# CONFIG_MBEDTLS_PEM_CERTIFICATE_FORMAT=y
# MbedTLS and security
# TLS configuration
CONFIG_NET_SOCKETS_SOCKOPT_TLS=y
CONFIG_NET_SOCKETS_TLS_MAX_CONTEXTS=6
CONFIG_MBEDTLS_HASH_ALL_ENABLED=y
CONFIG_MBEDTLS_CMAC=y
# Debugging options
CONFIG_MBEDTLS_DEBUG=y
CONFIG_MBEDTLS_LOG_LEVEL_DBG=y

CONFIG_PSA_WANT_ALG_SHA3_384=y
CONFIG_PSA_WANT_ALG_RSA_PKCS1V15_CRYPT=y
CONFIG_PSA_WANT_ALG_RSA_PKCS1V15_SIGN=y
CONFIG_PSA_WANT_KEY_TYPE_RSA_PUBLIC_KEY=y
CONFIG_PSA_WANT_ECC_SECP_R1_384=y

# Shell
CONFIG_SHELL=y
CONFIG_SHELL_CMD_BUFF_SIZE=128
# In order to allow calls to the shell in the application, the dummy shell backend needs to be enabled.
# CONFIG_SHELL_BACKEND_DUMMY=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_ECHO_STATUS=y
CONFIG_SHELL_STACK_SIZE=8192
CONFIG_SHELL_PROMPT_UART="hotbot:~$ "
# Allow shell to reboot system
CONFIG_REBOOT=y

#In order to use the ping operation, the networking shell needs to be enabled.
CONFIG_NET_SHELL=y
CONFIG_NET_L2_WIFI_SHELL=y


# Power Meter Configs
CONFIG_POWER=n
CONFIG_POWER_METER_DRIVER=n
CONFIG_ADE9153A=n
CONFIG_SENSOR=n
