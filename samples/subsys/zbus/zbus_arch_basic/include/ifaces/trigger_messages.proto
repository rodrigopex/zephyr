syntax = "proto3";

message MsgTriggerEventInitiated
{
}

message MsgTriggerEventReady
{
}

message MsgTriggerEventFailed
{
	int32 error_code = 1;
}

message MsgTriggerEventActivated
{
}

message MsgTriggerEvent
{
	oneof trigger_evt
	{
		MsgTriggerEventInitiated initiated = 1;
		MsgTriggerEventReady ready = 2;
		MsgTriggerEventFailed failed = 3;
		MsgTriggerEventActivated activated = 4;
	}
}
